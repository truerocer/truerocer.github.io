<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>AI 資訊整理實驗站</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background: #F7F4EE;
      color: #2c2c2c;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      max-width: 600px;
      padding: 3.5rem 2.5rem;
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: #E8F0FA;
      border: 1px solid #B8CFEA;
      border-radius: 20px;
      padding: 0.3rem 1.1rem;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      color: #3A6EA5;
      margin-bottom: 2rem;
      text-transform: uppercase;
      font-weight: 500;
    }
    h1 {
      font-size: 1.65rem;
      font-weight: 700;
      color: #1A3D6E;
      line-height: 1.5;
      margin-bottom: 1.4rem;
      letter-spacing: 0.02em;
    }
    p {
      font-size: 0.95rem;
      color: #4a4a4a;
      line-height: 1.9;
      margin-bottom: 0.8rem;
    }
    .divider {
      border: none;
      border-top: 1px solid #D5E3F0;
      margin: 2rem auto;
      width: 60%;
    }
    .note {
      font-size: 0.8rem;
      color: #8A9BB0;
    }
    .accent-bar {
      width: 48px;
      height: 3px;
      background: linear-gradient(90deg, #2B5FA5, #6A9FD4);
      border-radius: 2px;
      margin: 0 auto 2rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">Experiment</div>
    <div class="accent-bar"></div>
    <h1>AI 整理政治相關資訊實驗</h1>
    <p>本站為 AI 輔助資料整理之實驗性質站台，<br>收錄公開新聞來源的事件查核與彙整。</p>
    <p>所有內容均標注資料來源與查證狀態，僅供參考。</p>
    <hr class="divider">
    <p class="note">內容持續更新中</p>
  </div>
</body>
</html>
